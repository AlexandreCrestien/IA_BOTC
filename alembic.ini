# Configuration d'Alembic (migrations de la base). L'adresse de la base n'est pas ici :
# elle vient de DATABASE_URL (.env), comme pour le serveur (backend/db/database.py, database_url).
#
# Le serveur applique les migrations tout seul au démarrage. À la main :
#   alembic upgrade head                                  appliquer les migrations
#   alembic revision --autogenerate -m "description"     créer une migration après un changement de models.py
#   alembic current / alembic history                    état de la base, liste des migrations

[alembic]
script_location = backend/db/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
