<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lantern Hollow - Nouveau mot de passe</title>

    <!-- Mêmes polices que l'interface de jeu -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=IM+Fell+English+SC&display=swap" rel="stylesheet">

    <!-- Tailwind CSS v3 CDN + configuration du thème -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/tailwind.config.js"></script>

    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="min-h-screen font-sans">
    <!-- Page ouverte depuis le lien de l'e-mail « mot de passe oublié » : /reset-password.html?token=… -->
    <main class="fixed inset-0 flex items-center justify-center bg-cover bg-center bg-no-repeat bg-game-background">
        <div class="panel p-8 rounded-2xl max-w-lg w-full mx-4 shadow-2xl flex flex-col items-center space-y-5">
            <div class="ornament text-xs tracking-[0.3em] uppercase font-serif">LANTERNSWOOD · 1888</div>
            <h1 class="font-display text-2xl tracking-wide text-gilt uppercase text-center">Nouveau mot de passe</h1>

            <form id="reset-form" class="w-full space-y-3">
                <label for="reset-password" class="text-xs font-semibold text-gray-400 uppercase tracking-wider block">Nouveau mot de passe (8 caractères au moins)</label>
                <input type="password" id="reset-password" autocomplete="new-password" class="welcome-input w-full font-mono" autofocus>
                <label for="reset-password-confirm" class="text-xs font-semibold text-gray-400 uppercase tracking-wider block">Confirmer le mot de passe</label>
                <input type="password" id="reset-password-confirm" autocomplete="new-password" class="welcome-input w-full font-mono">
                <button type="submit" id="reset-btn" class="w-full bg-seal text-white font-display tracking-wider py-3.5 rounded-xl transition shadow-seal uppercase text-sm font-bold disabled:opacity-60 disabled:cursor-progress">
                    Enregistrer le mot de passe
                </button>
                <p id="reset-error" role="alert" class="welcome-error hidden text-sm text-center"></p>
            </form>

            <!-- Lien sans jeton, ou expiré : on renvoie vers l'accueil pour en demander un nouveau -->
            <div id="reset-invalid" class="modal-notice notice-blood hidden w-full text-center"></div>

            <a href="/" class="text-sm underline opacity-70 hover:opacity-100">Retour à l'accueil</a>
        </div>
    </main>

    <script src="/js/reset-password.js"></script>
</body>
</html>
