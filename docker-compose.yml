# Services locaux du jeu (le serveur, lui, se lance avec `python main.py`).
#   docker compose up -d      démarrer
#   docker compose ps         état des services
#   docker compose down       arrêter (les données sont gardées dans le volume pgdata)
#
# Identifiants : POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB et POSTGRES_PORT du fichier .env
# (lu automatiquement par Docker Compose), sinon les valeurs par défaut ci-dessous.
services:
  db:
    image: postgres:17.6-alpine
    container_name: lantern-hollow-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lantern}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lantern}
      POSTGRES_DB: ${POSTGRES_DB:-lantern_hollow}
    ports:
      # Accessible depuis cet ordinateur seulement
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Au premier démarrage : création de la base des tests (docker/postgres-init.sql)
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
